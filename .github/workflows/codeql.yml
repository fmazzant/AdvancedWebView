name: CodeQL

on:
  push:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  pull_request:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  schedule:
    - cron: '45 5 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # build-mode "none" analyzes C# without compiling, so no MAUI/iOS workload is needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
