name: Publish to NuGet

# Runs when a tag such as v1.2.3 is pushed. The tag sets the package version.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  publish:
    # Windows: the only host that builds every target. The Windows target (WinUI) needs Windows,
    # and the Android, iOS and Mac Catalyst libraries compile there too (no Mac is needed for a library).
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install Android dependencies
        run: >
          dotnet build src/AdvancedWebView/AdvancedWebView.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION=""; fi
          dotnet pack src/AdvancedWebView/AdvancedWebView.csproj -c Release -o artifacts ${VERSION:+-p:Version=$VERSION}

      # bash expands the glob: on Windows, NuGet's own wildcard handling does not resolve "artifacts/*.nupkg"
      # (forward slash). The matching .snupkg next to each .nupkg is pushed automatically.
      - name: Publish on NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          ls -la artifacts || true
          if [ ${#packages[@]} -eq 0 ]; then echo "No .nupkg found in artifacts/"; exit 1; fi
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
