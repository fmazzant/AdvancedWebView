name: NuGet

# Runs when a tag such as v1.2.3 is pushed. The tag sets the package version. A tag push also creates the GitHub
# Release of the tag, with the packages attached and the notes of the matching "## [x.y.z]" section of CHANGELOG.md.
#
# Authentication: NuGet Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing),
# no long-lived API key. The NuGet/login step exchanges the GitHub OIDC token for a temporary API key (valid 1 hour).
# Requires:
# - on nuget.org (Account > Trusted Publishing) a policy with repository owner "fmazzant", repository "AdvancedWebView",
#   workflow file "nuget.yml" (renaming this file breaks publishing) and environment "production";
# - the GitHub environment "production" with the secret NUGET_USER: the nuget.org username (not the email)
#   of the user who created the policy.

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  publish:
    # Windows: the only host that builds every target. The Windows target (WinUI) needs Windows,
    # and the Android, iOS and Mac Catalyst libraries compile there too (no Mac is needed for a library).
    runs-on: windows-latest
    # Must match the environment of the NuGet Trusted Publishing policy
    environment: production
    permissions:
      contents: write # needed to create the GitHub Release
      id-token: write # needed by NuGet/login (Trusted Publishing)

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install Android dependencies
        run: >
          dotnet build src/AdvancedWebView/AdvancedWebView.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION=""; fi
          dotnet pack src/AdvancedWebView/AdvancedWebView.csproj -c Release -o artifacts ${VERSION:+-p:Version=$VERSION}

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # bash expands the glob: on Windows, NuGet's own wildcard handling does not resolve "artifacts/*.nupkg"
      # (forward slash). The matching .snupkg next to each .nupkg is pushed automatically.
      - name: Publish on NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg)
          ls -la artifacts || true
          if [ ${#packages[@]} -eq 0 ]; then echo "No .nupkg found in artifacts/"; exit 1; fi
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # Tag push only: creates the GitHub Release of the tag with the packages attached and the notes of the matching
      # "## [x.y.z]" section of CHANGELOG.md. Never blocks the publish: a missing or empty section only gives a warning
      # and a release with a link to CHANGELOG.md. A release created by hand on GitHub (which also creates the tag and
      # starts this run) is kept as it is, title and notes included: only the packages are attached, replacing those
      # of a previous run.
      - name: Extract the release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          # Keep a Changelog headings: "## [1.2.3] - 2026-12-01", "## [1.2.3] - Unreleased", "## 1.2.3", ...
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          HEADING="$(grep -E "^## \[?${RELEASE_VERSION//./\\.}\]?( |$)" CHANGELOG.md | head -n 1 | tr -d '\r')"
          NOTES="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES"
          if [ -n "$HEADING" ]; then
            # Prints the lines between the heading and the next "## " heading.
            awk -v heading="$HEADING" '
              { sub(/\r$/, "") }
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES"
          fi
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::warning::CHANGELOG.md has no notes for $RELEASE_VERSION: the release links to CHANGELOG.md"
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)." > "$NOTES"
          fi

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg artifacts/*.snupkg)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists: attaching the packages"
            gh release upload "$GITHUB_REF_NAME" "${packages[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${packages[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
