name: CI

on:
  push:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  pull_request:
    branches: [ main, 'release/*', 'release-candidate/*' ]
  workflow_dispatch:

jobs:
  build:
    # macOS with Xcode 27 is required to build the iOS target.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Must match the pinned MAUI workload below: workload set 10.0.403 (iOS 27.1.x) requires Xcode 27.1.
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      # Pinned workload set: without --version the latest one is installed, and a new release can
      # require a newer Xcode (or new build checks) and break the build. Update it manually,
      # together with the Xcode version above.
      - name: Install MAUI workload
        run: dotnet workload install maui --version 10.0.403

      # Installs the Android platform (API 36) and build tools that .NET 10 compiles against.
      - name: Install Android dependencies
        run: >
          dotnet build src/AdvancedWebView/AdvancedWebView.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build library
        run: dotnet build src/AdvancedWebView/AdvancedWebView.csproj -c Release

      # Bridge core + JavaScript (in Jint) end-to-end tests; plain net10.0, no device needed.
      - name: Test
        run: dotnet test --project tests/AdvancedWebView.Tests/AdvancedWebView.Tests.csproj -c Release

      # Debug targets the iOS simulator, so no code signing is needed.
      - name: Build sample app
        run: dotnet build samples/AdvancedWebView.Sample/AdvancedWebView.Sample.csproj -c Debug

      - name: Pack
        run: dotnet pack src/AdvancedWebView/AdvancedWebView.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*

  # The Windows target (WebView2) builds on Windows only.
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build library (Windows)
        run: dotnet build src/AdvancedWebView/AdvancedWebView.csproj -c Release -f net10.0-windows10.0.19041.0

      - name: Build sample app (Windows)
        run: dotnet build samples/AdvancedWebView.Sample/AdvancedWebView.Sample.csproj -c Debug -f net10.0-windows10.0.19041.0
