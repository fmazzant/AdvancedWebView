name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macOS is required to build the iOS target.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The .NET 10 iOS workload needs Xcode 26; the runner's default Xcode may be older.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI workload
        run: dotnet workload install maui

      # Installs the Android platform (API 36) and build tools that .NET 10 compiles against.
      - name: Install Android dependencies
        run: >
          dotnet build src/AdvancedWebView/AdvancedWebView.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build library
        run: dotnet build src/AdvancedWebView/AdvancedWebView.csproj -c Release

      # Debug targets the iOS simulator, so no code signing is needed.
      - name: Build sample app
        run: dotnet build samples/AdvancedWebView.Sample/AdvancedWebView.Sample.csproj -c Debug

      - name: Pack
        run: dotnet pack src/AdvancedWebView/AdvancedWebView.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*
