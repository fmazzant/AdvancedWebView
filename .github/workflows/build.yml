name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macOS is required to build the iOS target.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore src/AdvancedWebView/AdvancedWebView.csproj

      - name: Build
        run: dotnet build src/AdvancedWebView/AdvancedWebView.csproj -c Release --no-restore

      # Debug targets the iOS simulator, so no code signing is needed.
      - name: Build sample app
        run: dotnet build samples/AdvancedWebView.Sample/AdvancedWebView.Sample.csproj -c Debug

      - name: Pack
        run: dotnet pack src/AdvancedWebView/AdvancedWebView.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*
